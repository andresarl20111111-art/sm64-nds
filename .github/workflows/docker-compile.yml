name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t sm64ds .
      
    - name: Compile the ROM
      run: docker run --rm --mount type=bind,source="$(pwd)",destination=/sm64 sm64ds make VERSION=us -j8

    - name: Upload NDS Rom Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sm64-ds-port
        path: |
          *.nds
          build/**/*.nds
