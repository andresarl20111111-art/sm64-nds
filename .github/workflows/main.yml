name: Compile SM64 DS Port

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compile with Docker
      run: |
        docker build -t sm64ds-compiler .
        docker run --name compiler-container sm64ds-compiler
        docker cp compiler-container:/app/build . || docker cp compiler-container:/workspace/build . || true

    - name: Upload NDS Rom Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sm64-ds-port
        path: |
          **/*.nds
          build/
