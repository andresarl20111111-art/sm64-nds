name: Compile SM64 DS Port Manual

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t sm64ds-compiler .

    - name: Create Container and Extract Rom
      run: |
        # Creamos el contenedor sin ejecutarlo para inspeccionarlo
        docker create --name game_container sm64ds-compiler
        
        # Le ordenamos a GitHub crear una carpeta afuera
        mkdir -p extracted_game
        
        # Buscamos y extraemos CUALQUIER archivo .nds del contenedor a la mala
        docker cp game_container:/workspace/build/ . || true
        docker cp game_container:/app/build/ . || true
        docker cp game_container:/workspace/ . || true
        docker cp game_container:/app/ . || true
        
        # Comando de rastreo profundo
        find . -name "*.nds" -exec cp {} extracted_game/ \; || true

    - name: Upload NDS Rom Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sm64-ds-port-ready
        path: |
          extracted_game/
          **/*.nds
